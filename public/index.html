<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VoiceChat — защищённый мессенджер с голосовым и видео чатом">
  <title>VoiceChat</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
</head>
<body>

<!-- ═══════════════════════════════════════
     ЭКРАН АВТОРИЗАЦИИ
════════════════════════════════════════ -->
<div id="auth-screen">

  <div class="auth-card">
    <div class="auth-logo">🎙️</div>
    <h1 class="auth-title">VoiceChat</h1>
    <p class="auth-subtitle">Защищённый мессенджер</p>

    <!-- Вход -->
    <div id="auth-login">
      <form id="form-login" autocomplete="on">
        <div class="form-group">
          <label for="login-username">Имя пользователя</label>
          <input id="login-username" type="text" placeholder="Введите имя"
                 autocomplete="username" required maxlength="24">
        </div>
        <div class="form-group">
          <label for="login-password">Пароль</label>
          <input id="login-password" type="password" placeholder="Введите пароль"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Войти</button>
      </form>
      <p class="auth-switch">
        Нет аккаунта?
        <a href="#" id="link-to-register">Зарегистрироваться</a>
      </p>
    </div>

    <!-- Регистрация -->
    <div id="auth-register" style="display:none">
      <form id="form-register" autocomplete="on">
        <div class="form-group">
          <label for="reg-username">Имя пользователя</label>
          <input id="reg-username" type="text" placeholder="От 2 до 24 символов"
                 autocomplete="username" required minlength="2" maxlength="24">
        </div>
        <div class="form-group">
          <label for="reg-password">Пароль</label>
          <input id="reg-password" type="password" placeholder="Минимум 4 символа"
                 autocomplete="new-password" required minlength="4">
        </div>
        <button type="submit" class="btn-primary btn-full">Зарегистрироваться</button>
      </form>
      <p class="auth-switch">
        Уже есть аккаунт?
        <a href="#" id="link-to-login">Войти</a>
      </p>
    </div>

  </div>
</div>

<!-- ═══════════════════════════════════════
     ГЛАВНЫЙ ЭКРАН ПРИЛОЖЕНИЯ
════════════════════════════════════════ -->
<div id="app-screen" style="display:none">

  <!-- ── Левая панель (сайдбар) ─────────── -->
  <aside class="sidebar">

    <!-- Шапка профиля -->
    <div class="sidebar-profile">
      <div id="profile-avatar" class="sidebar-avatar"></div>
      <div class="sidebar-profile-info">
        <span id="profile-username" class="sidebar-username"></span>
      </div>
      <button id="btn-edit-profile" class="btn-icon" title="Редактировать профиль">⚙️</button>
    </div>

    <!-- Кнопки навигации -->
    <div class="sidebar-nav">
      <button id="btn-show-rooms"    class="btn-nav active" title="Комнаты">💬 Комнаты</button>
      <button id="btn-show-contacts" class="btn-nav"        title="Контакты">
        👥 Контакты
        <span id="requests-badge" class="badge" style="display:none">0</span>
      </button>
    </div>

    <!-- Панель комнат -->
    <div id="rooms-panel" class="sidebar-panel">

      <!-- Поиск комнат -->
      <div class="search-wrap">
        <input id="room-search" type="search" placeholder="🔍 Поиск комнат" class="input-search">
      </div>

      <!-- Список комнат -->
      <div id="room-list" class="room-list"></div>

      <!-- Создание комнаты -->
      <button id="btn-create-room" class="btn-secondary btn-full">➕ Новая комната</button>
      <div id="create-room-form" style="display:none">
        <form id="form-create-room" class="create-room-form">
          <input id="new-room-name" type="text"     placeholder="Название комнаты"
                 maxlength="64" required class="input-text">
          <input id="new-room-pass" type="password" placeholder="Пароль (необязательно)"
                 class="input-text">
          <label class="checkbox-label">
            <input id="new-room-group" type="checkbox">
            <span>Групповой чат</span>
          </label>
          <div class="form-row">
            <button type="submit"             class="btn-primary">Создать</button>
            <button type="button" id="btn-cancel-create" class="btn-ghost">Отмена</button>
          </div>
        </form>
      </div>

    </div>

    <!-- Панель контактов -->
    <div id="contacts-panel" class="sidebar-panel" style="display:none">

      <!-- Заявки -->
      <div class="contacts-section">
        <div class="section-title">📨 Заявки</div>
        <div id="contact-requests-list" class="contacts-list"></div>
      </div>

      <!-- Контакты -->
      <div class="contacts-section">
        <div class="section-title">👥 Мои контакты</div>
        <div id="contacts-list" class="contacts-list"></div>
      </div>

    </div>

    <!-- Нижние кнопки -->
    <div class="sidebar-footer">
      <button id="btn-theme"  class="btn-icon" title="Сменить тему">🌙</button>
      <button id="btn-logout" class="btn-icon btn-danger" title="Выйти">🚪</button>
    </div>

  </aside>

  <!-- ── Правая часть (чат) ─────────────── -->
  <main class="chat-main">

    <!-- Пустой экран -->
    <div id="empty-screen" class="empty-screen">
      <div class="empty-icon">💬</div>
      <div class="empty-title">Выберите комнату</div>
      <div class="empty-sub">чтобы начать общение</div>
    </div>

    <!-- Чат-область -->
    <div id="chat-area" class="chat-area" style="display:none">

      <!-- Шапка чата -->
      <header class="chat-header">
        <div class="chat-header-left">
          <span id="current-room-name" class="chat-room-name"></span>
          <span id="user-count" class="user-count">0 онлайн</span>
        </div>
        <div class="chat-header-right">
          <input id="msg-search" type="search" placeholder="🔍 Поиск сообщений"
                 class="input-search input-search-sm">
        </div>
      </header>

      <!-- Закреплённое сообщение -->
      <div id="pinned-banner" class="pinned-banner" style="display:none">
        <span class="pinned-preview">📌 Закреплённое сообщение</span>
        <button class="btn-unpin btn-icon" title="Открепить">✕</button>
      </div>

      <!-- Основная область -->
      <div class="chat-body">

        <!-- Список участников -->
        <div class="users-sidebar">
          <div class="users-title">Участники</div>
          <div id="user-list" class="user-list"></div>

          <!-- Голосовые кнопки -->
          <div class="voice-controls">
            <button id="btn-join-voice"  class="btn-voice">🎙️ Голос</button>
            <button id="btn-leave-voice" class="btn-voice btn-danger" style="display:none">📴 Выйти</button>
            <button id="btn-mute"        class="btn-voice btn-mute"   style="display:none">🎙️ Микрофон</button>
            <button id="btn-start-video" class="btn-voice">📹 Видео</button>
            <button id="btn-stop-video"  class="btn-voice btn-danger" style="display:none">📹 Стоп</button>
          </div>

          <!-- Видео область -->
          <div id="video-area" class="video-area" style="display:none"></div>
        </div>

        <!-- Сообщения -->
        <div class="messages-wrap">
          <div id="message-list" class="message-list"></div>
          <div id="typing-indicator" class="typing-indicator" style="display:none"></div>
        </div>

      </div>

      <!-- Панель ввода -->
      <footer class="chat-footer">

        <!-- Reply bar -->
        <div id="reply-bar" class="reply-bar" style="display:none">
          <span class="reply-info"></span>
          <button id="btn-cancel-reply" class="btn-icon">✕</button>
        </div>

        <!-- Edit bar -->
        <div id="edit-bar" class="edit-bar" style="display:none">
          <span class="edit-info"></span>
          <button id="btn-cancel-edit" class="btn-icon">✕</button>
        </div>

        <!-- Ввод -->
        <div id="chat-input-wrap" class="chat-input-wrap">
          <button id="btn-emoji"       class="btn-icon" title="Эмодзи">😀</button>
          <button id="btn-attach-file" class="btn-icon" title="Прикрепить файл">📎</button>
          <input  id="file-input" type="file" style="display:none"
                  accept="image/*,audio/*,video/*,.pdf,.doc,.docx,.txt,.zip">
          <textarea id="chat-input" class="chat-input"
                    placeholder="Написать сообщение..."
                    rows="1" maxlength="4000"></textarea>
          <button id="btn-send" class="btn-send" title="Отправить">➤</button>
        </div>

      </footer>

    </div>
  </main>

</div>

<!-- ═══════════════════════════════════════
     МОДАЛЬНОЕ ОКНО ПРОФИЛЯ
════════════════════════════════════════ -->
<div id="profile-modal" class="modal-overlay" style="display:none">
  <div class="modal-card">

    <div class="modal-header">
      <h2 class="modal-title">✏️ Редактировать профиль</h2>
      <button id="btn-close-profile" class="btn-icon">✕</button>
    </div>

    <form id="form-profile" class="modal-body">

      <!-- Аватар -->
      <div class="avatar-upload">
        <div id="profile-avatar-preview" class="avatar-preview"></div>
        <label class="btn-secondary btn-sm" for="profile-avatar-input">
          📷 Сменить фото
        </label>
        <input id="profile-avatar-input" type="file"
               accept="image/*" style="display:none">
      </div>

      <!-- Имя (readonly) -->
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" class="input-text"
               value="" id="profile-username-display"
               disabled style="opacity:.6">
      </div>

      <!-- Биография -->
      <div class="form-group">
        <label for="profile-bio-input">О себе</label>
        <textarea id="profile-bio-input" class="input-text"
                  placeholder="Расскажите о себе..."
                  rows="3" maxlength="200"></textarea>
      </div>

      <button type="submit" class="btn-primary btn-full">💾 Сохранить</button>

    </form>
  </div>
</div>

<!-- ═══════════════════════════════════════
     СКРИПТЫ
════════════════════════════════════════ -->
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>

</body>
</html>
