<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>📞 Voice Chat</h1>
            <div id="status" class="status disconnected">Отключено</div>
        </header>

        <main class="main-screen">
            <div class="room-controls">
                <input type="text" id="roomId" placeholder="Введите ID комнаты (например: 12345)" maxlength="10">
                <button id="joinBtn" class="btn btn-primary">🎧 Подключиться</button>
                <button id="createBtn" class="btn btn-secondary">➕ Создать комнату</button>
            </div>

            <div class="call-controls hidden" id="callControls">
                <div class="user-info">
                    <div class="avatar">👤</div>
                    <div id="peerStatus">Собеседник подключается...</div>
                </div>
                
                <div class="controls-row">
                    <button id="muteBtn" class="btn-control">🎤</button>
                    <button id="hangupBtn" class="btn-control btn-danger">📞</button>
                </div>
            </div>
        </main>

        <div id="audioContainer"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
