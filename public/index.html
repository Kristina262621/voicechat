<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Голосовой звонок</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #16213e;
      border-radius: 20px;
      padding: 40px;
      width: 380px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 { font-size: 24px; margin-bottom: 8px; color: #e94560; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }

    label { display: block; text-align: left; margin-bottom: 6px; font-size: 14px; color: #aaa; }

    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
      margin-bottom: 14px;
    }
    input:focus { border-color: #e94560; }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #btn-join { background: #e94560; color: #fff; }
    #btn-join:hover:not(:disabled) { background: #c73652; }

    #btn-leave { background: #444; color: #fff; display: none; }
    #btn-leave:hover { background: #333; }

    #btn-mute { background: #0f3460; color: #fff; display: none; }
    #btn-mute:hover { background: #1a4a80; }

    #btn-mute.muted { background: #e94560; }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      background: #0f3460;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.green { background: #4caf50; animation: pulse 1.5s infinite; }
    .dot.yellow { background: #ff9800; }
    .dot.red { background: #e94560; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .participants {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .participant {
      background: #0f3460;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .participant .p-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff9800;
      flex-shrink: 0;
    }
    .participant .p-dot.connected { background: #4caf50; animation: pulse 1.5s infinite; }

    .volume-bar {
      margin-left: auto;
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 16px;
    }
    .volume-bar span {
      width: 3px;
      background: #4caf50;
      border-radius: 2px;
      transition: height 0.1s;
    }

    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #555;
      line-height: 1.6;
    }

    .copy-link {
      margin-top: 16px;
      font-size: 12px;
      color: #e94560;
      cursor: pointer;
      text-decoration: underline;
      display: none;
    }
    .copy-link:hover { color: #ff6b85; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #4caf50;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🎙️ Голосовой звонок</h1>
  <p class="subtitle">Введи одинаковый код комнаты с другом</p>

  <div id="join-section">
    <label>Твоё имя</label>
    <input id="name-input" type="text" placeholder="например: Антон" maxlength="20" />

    <label>Код комнаты</label>
    <input id="room-input" type="text" placeholder="например: myroom123" maxlength="30" />

    <button id="btn-join">Войти в комнату</button>
  </div>

  <button id="btn-mute">🎤 Выключить микрофон</button>
  <button id="btn-leave">📴 Выйти из звонка</button>

  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Введи код комнаты и нажми "Войти"</span>
  </div>

  <div class="participants" id="participants"></div>

  <div class="hint" id="hint">
    Ты и друг должны ввести <strong>одинаковый</strong> код комнаты
  </div>

  <span class="copy-link" id="copy-link">📋 Скопировать ссылку на эту страницу</span>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const btnJoin = document.getElementById('btn-join');
  const btnLeave = document.getElementById('btn-leave');
  const btnMute = document.getElementById('btn-mute');
  const nameInput = document.getElementById('name-input');
  const roomInput = document.getElementById('room-input');
  const joinSection = document.getElementById('join-section');
  const statusText = document.getElementById('status-text');
  const statusDot = document.getElementById('status-dot');
  const participantsDiv = document.getElementById('participants');
  const hint = document.getElementById('hint');
  const copyLink = document.getElementById('copy-link');
  const toast = document.getElementById('toast');

  let localStream = null;
  let peers = {};
  let participantNames = {};
  let analyserNodes = {};
  let muted = false;
  let currentRoom = null;
  let myName = '';

  // ----- Toast -----
  function showToast(msg, color = '#4caf50') {
    toast.textContent = msg;
    toast.style.background = color;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ----- Status -----
  function setStatus(text, color) {
    statusText.textContent = text;
    statusDot.className = 'dot ' + (color || '');
  }

  // ----- ICE Config с TURN -----
  const iceConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      {
        urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      },
      {
        urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      },
      {
        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      }
    ]
  };

  // ----- Участники UI -----
  function addParticipantUI(id, name) {
    removeParticipantUI(id);
    const div = document.createElement('div');
    div.className = 'participant';
    div.id = 'p-' + id;
    div.innerHTML = `
      <div class="p-dot" id="pdot-${id}"></div>
      <span>${name}</span>
      <div class="volume-bar" id="vol-${id}">
        <span id="vb1-${id}" style="height:4px"></span>
        <span id="vb2-${id}" style="height:4px"></span>
        <span id="vb3-${id}" style="height:4px"></span>
      </div>
    `;
    participantsDiv.appendChild(div);
  }

  function removeParticipantUI(id) {
    const el = document.getElementById('p-' + id);
    if (el) el.remove();
    if (analyserNodes[id]) {
      analyserNodes[id].active = false;
      delete analyserNodes[id];
    }
  }

  function setParticipantConnected(id) {
    const dot = document.getElementById('pdot-' + id);
    if (dot) dot.classList.add('connected');
  }

  // ----- Визуализация громкости -----
  function startVolumeVisualizer(id, stream) {
    try {
      const ctx = new AudioContext();
      const source = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      const state = { active: true };
      analyserNodes[id] = state;

      function draw() {
        if (!state.active) { ctx.close(); return; }
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(data);
        const avg = data.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
        const h = Math.min(16, Math.max(2, avg / 8));
        const b1 = document.getElementById('vb1-' + id);
        const b2 = document.getElementById('vb2-' + id);
        const b3 = document.getElementById('vb3-' + id);
        if (b1) b1.style.height = (h * 0.6) + 'px';
        if (b2) b2.style.height = h + 'px';
        if (b3) b3.style.height = (h * 0.7) + 'px';
      }
      draw();
    } catch(e) {}
  }

  // ----- Создание peer соединения -----
  function createPeer(remoteId, initiator) {
    if (peers[remoteId]) return peers[remoteId];

    const pc = new RTCPeerConnection(iceConfig);

    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    pc.ontrack = (event) => {
      let audio = document.getElementById('audio-' + remoteId);
      if (!audio) {
        audio = document.createElement('audio');
        audio.id = 'audio-' + remoteId;
        audio.autoplay = true;
        document.body.appendChild(audio);
      }
      audio.srcObject = event.streams[0];
      startVolumeVisualizer(remoteId, event.streams[0]);
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        socket.emit('ice-candidate', { to: remoteId, candidate: event.candidate });
      }
    };

    pc.onconnectionstatechange = () => {
      console.log('Соединение с', remoteId, ':', pc.connectionState);
      if (pc.connectionState === 'connected') {
        setParticipantConnected(remoteId);
      }
      if (pc.connectionState === 'failed') {
        removePeer(remoteId);
        setStatus('Ошибка соединения', 'red');
      }
      updateStatus();
    };

    if (initiator) {
      pc.createOffer()
        .then(offer => pc.setLocalDescription(offer))
        .then(() => socket.emit('offer', { to: remoteId, offer: pc.localDescription }));
    }

    peers[remoteId] = pc;
    return pc;
  }

  function updateStatus() {
    const ids = Object.keys(peers);
    if (ids.length === 0) {
      setStatus('Ожидаем собеседника...', 'yellow');
      return;
    }
    const connected = ids.filter(id => peers[id].connectionState === 'connected');
    if (connected.length > 0) {
      setStatus(`Звонок идёт · ${connected.length + 1} участника`, 'green');
    } else {
      setStatus('Подключаемся...', 'yellow');
    }
  }

  function removePeer(id) {
    if (peers[id]) {
      peers[id].close();
      delete peers[id];
    }
    const audio = document.getElementById('audio-' + id);
    if (audio) audio.remove();
    removeParticipantUI(id);
    updateStatus();
  }

  // ----- Кнопки -----
  btnJoin.addEventListener('click', async () => {
    const room = roomInput.value.trim();
    const name = nameInput.value.trim() || 'Аноним';
    if (!room) { showToast('Введи код комнаты!', '#e94560'); return; }

    myName = name;

    try {
      setStatus('Запрашиваем микрофон...', 'yellow');
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      showToast('Нет доступа к микрофону!', '#e94560');
      setStatus('Ошибка микрофона', 'red');
      return;
    }

    currentRoom = room;
    socket.emit('join-room', { roomId: room, name });

    joinSection.style.display = 'none';
    btnMute.style.display = 'block';
    btnLeave.style.display = 'block';
    hint.style.display = 'none';
    copyLink.style.display = 'block';
    setStatus('Ожидаем собеседника...', 'yellow');
    showToast('Вошёл в комнату: ' + room);
  });

  btnLeave.addEventListener('click', () => {
    Object.keys(peers).forEach(removePeer);
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    socket.disconnect();
    location.reload();
  });

  btnMute.addEventListener('click', () => {
    if (!localStream) return;
    muted = !muted;
    localStream.getAudioTracks().forEach(t => t.enabled = !muted);
    btnMute.textContent = muted ? '🔇 Включить микрофон' : '🎤 Выключить микрофон';
    btnMute.classList.toggle('muted', muted);
    showToast(muted ? 'Микрофон выключен' : 'Микрофон включён', muted ? '#e94560' : '#4caf50');
  });

  copyLink.addEventListener('click', () => {
    navigator.clipboard.writeText(window.location.href)
      .then(() => showToast('Ссылка скопирована!'))
      .catch(() => showToast('Не удалось скопировать', '#e94560'));
  });

  // ----- Socket события -----
  socket.on('room-users', (users) => {
    users.forEach(({ id, name }) => {
      participantNames[id] = name;
      addParticipantUI(id, name);
      createPeer(id, true);
    });
    if (users.length === 0) {
      setStatus('Ожидаем собеседника...', 'yellow');
    }
  });

  socket.on('user-joined', ({ id, name }) => {
    participantNames[id] = name;
    addParticipantUI(id, name);
    showToast(`${name} вошёл в комнату`);
  });

  socket.on('offer', async ({ from, offer }) => {
    const pc = createPeer(from, false);
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('answer', { to: from, answer });
  });

  socket.on('answer', async ({ from, answer }) => {
    if (peers[from]) {
      await peers[from].setRemoteDescription(new RTCSessionDescription(answer));
    }
  });

  socket.on('ice-candidate', async ({ from, candidate }) => {
    if (peers[from]) {
      try {
        await peers[from].addIceCandidate(new RTCIceCandidate(candidate));
      } catch(e) {}
    }
  });

  socket.on('user-left', ({ id, name }) => {
    removePeer(id);
    showToast(`${name || 'Собеседник'} покинул комнату`, '#ff9800');
    if (Object.keys(peers).length === 0) {
      setStatus('Ожидаем собеседника...', 'yellow');
    }
  });

  socket.on('connect_error', () => {
    setStatus('Ошибка подключения к серверу', 'red');
  });
</script>
</body>
</html>
