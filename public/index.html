<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Голосовой чат</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 50vh;
    }

    .container {
      text-align: center;
      padding: 40px;
      background: #16213e;
      border-radius: 20px;
      width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 { font-size: 28px; margin-bottom: 8px; }
    p.subtitle { color: #888; margin-bottom: 30px; }

    /* ── Экран пароля ── */
    #screen-password { display: block; }
    #screen-chat     { display: none;  }

    .password-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-input-wrap input {
      width: 100%;
      padding: 14px 44px 14px 16px;
      border: 2px solid #0f3460;
      border-radius: 12px;
      background: #0f3460;
      color: white;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .password-input-wrap input:focus {
      border-color: #e94560;
    }

    .password-input-wrap input.error {
      border-color: #e94560;
      animation: shake 0.35s;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #888;
      padding: 4px;
    }
    .toggle-pw:hover { color: white; }

    .pw-error {
      font-size: 13px;
      color: #e94560;
      min-height: 18px;
      transition: opacity 0.2s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0);   }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px);  }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px);  }
    }

    /* ── Общие кнопки ── */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: #e94560; color: white; }
    .btn-primary:hover { background: #c73652; }
    .btn-primary:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .btn-leave {
      background: #333;
      color: #aaa;
      margin-top: 12px;
    }
    .btn-leave:hover { background: #444; }

    .btn-mic {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      background: #0f3460;
      color: white;
      display: none;
      transition: all 0.2s;
    }
    .btn-mic:hover { background: #1a4a7a; }

    /* ── Статус ── */
    .status-box {
      background: #0f3460;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .user-count {
      font-size: 36px;
      font-weight: bold;
      color: #e94560;
    }

    .user-label { font-size: 13px; color: #aaa; margin-top: 4px; }

    .mic-status {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
      display: none;
    }
    .mic-status.active { display: block; color: #4caf50; }
    .mic-status.muted  { display: block; color: #e94560; }

    /* ── Участники ── */
    .participants { margin-top: 24px; display: none; }
    .participants-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
      text-align: left;
    }

    .participant {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #0f3460;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .participant-name {
      font-size: 13px;
      flex: 1;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .volume-bar-wrap {
      width: 50px;
      height: 6px;
      background: #1a1a2e;
      border-radius: 3px;
      overflow: hidden;
    }

    .volume-bar {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: #4caf50;
      transition: width 0.08s;
    }
    .volume-bar.loud { background: #e94560; }

    /* ── Шкала сигнала ── */
    .signal-wrap {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
    }

    .signal-wrap .bar {
      width: 5px;
      border-radius: 2px;
      background: #1a1a2e;
      transition: background 0.4s;
    }

    .signal-wrap .bar:nth-child(1) { height: 4px;  }
    .signal-wrap .bar:nth-child(2) { height: 8px;  }
    .signal-wrap .bar:nth-child(3) { height: 12px; }
    .signal-wrap .bar:nth-child(4) { height: 16px; }

    .signal-excellent .bar             { background: #4caf50; }
    .signal-good .bar:nth-child(-n+3)  { background: #8bc34a; }
    .signal-fair .bar:nth-child(-n+2)  { background: #ff9800; }
    .signal-poor .bar:nth-child(1)     { background: #e94560; }

    /* ── Баннер переподключения ── */
    .reconnect-banner {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      background: #3a1a1a;
      border: 1px solid #e94560;
      border-radius: 10px;
      font-size: 13px;
      color: #ff6b6b;
      animation: pulse 1.5s infinite;
    }
    .reconnect-banner.visible { display: block; }

    @keyframes pulse {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.5; }
    }

    /* ── Шифрование ── */
    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 6px 12px;
      background: #0d2b1a;
      border: 1px solid #2e7d32;
      border-radius: 20px;
      font-size: 12px;
      color: #66bb6a;
    }

    #keep-alive-audio { position: absolute; width: 0; height: 0; opacity: 0; }
    #hidden-audios    { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎙️ Голосовой чат</h1>
  <p class="subtitle">Приватный — только по паролю</p>

  <!-- ══ ЭКРАН ПАРОЛЯ ══ -->
  <div id="screen-password">
    <div class="password-form">
      <div class="password-input-wrap">
        <input
          type="password"
          id="pw-input"
          placeholder="Введи пароль…"
          autocomplete="current-password"
          maxlength="64"
        />
        <button class="toggle-pw" id="btn-toggle-pw" type="button" title="Показать пароль">👁</button>
      </div>
      <div class="pw-error" id="pw-error"></div>
      <button class="btn btn-primary" id="btn-enter">🔑 Войти</button>
    </div>
  </div>

  <!-- ══ ЭКРАН ЧАТА ══ -->
  <div id="screen-chat">
    <div class="status-box">
      <div class="user-count" id="user-count">0</div>
      <div class="user-label">участников онлайн</div>
    </div>

    <button class="btn btn-primary" id="btn-join">🎙️ Войти в чат</button>
    <button class="btn btn-mic"     id="btn-mic"  style="display:none">🔇 Выключить микрофон</button>
    <button class="btn btn-leave"   id="btn-leave" style="display:none">Выйти из чата</button>

    <div class="mic-status" id="mic-status"></div>

    <div class="reconnect-banner" id="reconnect-banner">
      🔄 Соединение потеряно, переподключаемся…
    </div>

    <div class="secure-badge" id="secure-badge" style="display:none">
      🔒 Звонок зашифрован (DTLS-SRTP)
    </div>

    <div class="participants" id="participants">
      <div class="participants-title">Участники</div>
      <div id="participants-list"></div>
    </div>
  </div>
</div>

<audio id="keep-alive-audio" loop playsinline></audio>
<div id="hidden-audios"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
